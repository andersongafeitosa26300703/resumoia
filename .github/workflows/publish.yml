name: 3 - Publicar carrossel aprovado

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # So roda quando o rotulo "aprovado" e colocado (apenas quem tem permissao de escrita consegue rotular)
    if: github.event.label.name == 'aprovado' && (startsWith(github.event.issue.title, 'POST PARA APROVAÇÃO ') || startsWith(github.event.issue.title, 'Rascunho '))
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.issue.title }}
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extrair a data do titulo
        id: d
        run: |
          DATE=$(printf '%s' "$TITLE" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true)
          echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "Titulo invalido"; exit 1; }
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Publicar no Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publish_carousel.py "${{ steps.d.outputs.date }}"

      - name: Registrar publicacao
        run: |
          git config user.name "resumoia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "Registro da publicacao ${{ steps.d.outputs.date }}"
          git push

      - name: Avisar e fechar a Issue
        run: |
          gh issue comment "$ISSUE" --body "Publicado no Instagram."
          gh issue close "$ISSUE"

      - name: Avisar falha
        if: failure()
        run: gh issue comment "$ISSUE" --body "A publicacao falhou. Veja o log do workflow em Actions. Para tentar de novo, remova e recoloque o rotulo aprovado."
