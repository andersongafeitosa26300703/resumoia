name: 1 - Coletar noticias

on:
  schedule:
    # 07:30 UTC = 04:30 em Brasilia. A rotina do Claude le este arquivo as 05:00.
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar noticias dos feeds
        run: python scripts/fetch_news.py
      - name: Enviar candidatas ao repositorio
        run: |
          git config user.name "resumoia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/candidates.json
          git diff --cached --quiet || git commit -m "Noticias candidatas do dia"
          git push
