name: Diario - noticias, rascunho e pedido de aprovacao

on:
  schedule:
    # 08:00 UTC = 05:00 em Brasilia
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Data de hoje (Brasilia)
        id: d
        run: echo "today=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"

      - name: Coletar noticias dos feeds
        run: python scripts/fetch_news.py

      - name: Limpar o token do Claude (remove espacos e quebras de linha da colagem)
        id: tok
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CLEAN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          if [ -z "$CLEAN" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN esta vazio"; exit 1; fi
          echo "::add-mask::$CLEAN"
          echo "token=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Token do Claude: ${#CLEAN} caracteres, comeca com sk-ant-: $([[ $CLEAN == sk-ant-* ]] && echo sim || echo nao)"
          echo "Primeiros 6 caracteres: ${CLEAN:0:6} | tem http: $([[ $CLEAN == *http* ]] && echo sim || echo nao) | tem ponto: $([[ $CLEAN == *.* ]] && echo sim || echo nao)"
          if [[ $CLEAN != sk-ant-* ]]; then
            if [[ $CLEAN == EA[A-Z]* ]]; then echo "ERRO: este segredo parece ser um token do INSTAGRAM/Meta (comeca com EAA ou EAB). O token do Claude vem de 'claude setup-token' e comeca com sk-ant-."
            else echo "ERRO: o segredo CLAUDE_CODE_OAUTH_TOKEN nao e um token do Claude (deveria comecar com sk-ant-). Gere de novo com 'claude setup-token'."; fi
            exit 1
          fi

      - name: Claude escolhe e resume as noticias (na sua assinatura do Claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.tok.outputs.token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 12
            --allowedTools Read,Write,Edit,Glob,Grep
          prompt: |
            Voce e o editor do perfil de Instagram ResumoIA (@resumoia), que publica todo dia um carrossel com as
            principais noticias de inteligencia artificial, em portugues do Brasil. Sua unica tarefa: ler
            data/candidates.json, escolher e resumir as noticias do dia e gravar data/today.json. Nao execute git:
            o workflow cuida do commit. Nao altere nenhum outro arquivo.

            Data de hoje (Brasilia): ${{ steps.d.outputs.today }}

            PASSOS
            1. Leia data/candidates.json (lista de noticias das ultimas ~30 horas, com title, summary, source, link, published).
               Se tiver menos de 6 itens, NAO crie today.json e explique o motivo.
            2. Escolha 4 noticias diferentes sobre inteligencia artificial, priorizando: relevancia real (lancamentos de
               modelos e produtos, regulacao, pesquisa importante, negocios grandes, impacto no Brasil); noticias que
               aparecem em mais de um veiculo; variedade (sem repetir assunto; misture Brasil e mundo quando possivel).
               Evite rumores, opiniao, colunas, vagas de curso, publicidade e conteudo sem fato novo.
            3. Para cada uma escreva: title (portugues, claro e neutro, no maximo 90 caracteres); summary (2 a 3 frases,
               no maximo 280 caracteres, o que aconteceu e por que importa); source (nome do veiculo; se usar mais de
               um, "TechCrunch / UOL"); link (o link original do candidato).
            4. Escreva headline (manchete da capa, no maximo 100 caracteres, resumindo as 1 ou 2 noticias mais importantes)
               e intro (uma frase curta de abertura da legenda).
            5. Grave data/today.json em UTF-8 com este formato exato:
               {"date": "AAAA-MM-DD", "headline": "...", "intro": "...", "items": [{"title": "...", "summary": "...", "source": "...", "link": "https://..."}]}

            REGRAS (muito importantes)
            - Use SOMENTE fatos presentes nos candidatos (titulo e resumo). Nao invente numeros, nomes, datas, citacoes ou detalhes.
            - Parafraseie; nao copie frases inteiras das fontes (direitos autorais).
            - Atribua afirmacoes controversas ("segundo o TechCrunch", "afirma o ex-funcionario"); acusacao nao e fato.
            - Tom sobrio e informativo, sem sensacionalismo, sem opiniao, sem emojis.
            - Portugues correto, com acentos. Sem aspas duplas dentro de title e summary (use aspas simples).

      - name: Gerar imagens e legenda (valida o today.json)
        run: python scripts/make_draft.py

      - name: Enviar rascunho ao repositorio (as imagens precisam de URL publica)
        run: |
          git config user.name "resumoia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/candidates.json data/today.json drafts/
          git diff --cached --quiet || git commit -m "Rascunho de ${{ steps.d.outputs.today }}"
          git push

      - name: Abrir Issue de aprovacao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(python -c "import json;print(json.load(open('data/today.json',encoding='utf-8'))['date'])")
          TITLE="Rascunho $DATE"
          gh label create aprovado --color 0E8A16 --description "Aprova a publicacao no Instagram" --force
          if gh issue list --state all --search "\"$TITLE\" in:title" --json title --jq '.[].title' | grep -qx "$TITLE"; then
            echo "Ja existe Issue para $DATE; nada a fazer."
          else
            gh issue create --title "$TITLE" --body-file "drafts/$DATE/issue.md"
          fi
